upstream eval_web {
    server 127.0.0.1:41738;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name eval.zailink.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eval.zailink.space;

    # Replace these two paths with the certificate files installed on the ECS.
    ssl_certificate /etc/nginx/certs/eval.zailink.space.pem;
    ssl_certificate_key /etc/nginx/certs/eval.zailink.space.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # One Windows or macOS artifact (up to 320 MB) plus its signature.
    client_max_body_size 384m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://eval_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }
}
