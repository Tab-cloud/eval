<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 72" role="img" aria-labelledby="title desc">
  <title id="title">Luban Cloud</title>
  <desc id="desc">Luban Cloud horizontal brand lockup</desc>
  <style>
    .tile { fill: #1d1d1f; }
    .letter { fill: none; stroke: #ffffff; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .name { fill: #1d1d1f; font: 650 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -1px; }
    .product { fill: #6e6e73; font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .1px; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f5f5f7; }
      .letter { stroke: #1d1d1f; }
      .name { fill: #f5f5f7; }
      .product { fill: #a1a1a6; }
    }
  </style>
  <rect class="tile" x="4" y="4" width="64" height="64" rx="18"/>
  <path class="letter" d="M28 21v29h22"/>
  <text class="name" x="84" y="34">Luban</text>
  <text class="product" x="85" y="55">Cloud</text>
</svg>
